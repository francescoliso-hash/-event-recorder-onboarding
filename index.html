<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Y6NSZsjgiN68tRvd2JF3WOyekBfxi6HoV3TkTXmLqrE='; style-src 'sha256-OZUKTfoq8s+Z5Hea4MyQL3Zw3HmmvQ5hXnOnri6928o='; connect-src https://jvstdxxgdubogqpfiavu.supabase.co; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>(() => {
  "use strict";
  const fragment = new URLSearchParams(window.location.hash.slice(1));
  let tokenHash = fragment.get("token_hash");
  const flowType = fragment.get("type");
  window.history.replaceState(null, "", window.location.pathname);

  if (window.top !== window.self) {
    document.documentElement.hidden = true;
    window.stop();
    return;
  }

  const projectUrl = "https://jvstdxxgdubogqpfiavu.supabase.co";
  const publishableKey = "sb_publishable_4v7DajK2ef44dlsFpWQZnA_P9NfcIUN";
  let accessToken = null;
  const syntacticallyValid =
    /^[A-Za-z0-9_-]{32,256}$/.test(tokenHash || "") &&
    (flowType === "invite" || flowType === "recovery");

  const initialize = () => {
    const form = document.getElementById("activation");
    const status = document.getElementById("status");
    const submit = document.getElementById("submit");
    const password = document.getElementById("password");
    const confirmation = document.getElementById("confirmation");
    const eyebrow = document.getElementById("eyebrow");
    const title = document.getElementById("title");
    const introduction = document.getElementById("introduction");

    const showError = (message) => {
      status.className = "status error";
      status.textContent = message;
    };

    if (!syntacticallyValid) {
      tokenHash = null;
      showError("Il collegamento non è valido o è scaduto. Richiedi un nuovo link dall’app oppure contatta il supervisore.");
      return;
    }

    const isRecovery = flowType === "recovery";
    eyebrow.textContent = isRecovery
      ? "EVENT RECORDER / RECUPERO PASSWORD"
      : "EVENT RECORDER / INVITO";
    title.textContent = isRecovery
      ? "Scegli una nuova password"
      : "Completa l’attivazione";
    introduction.textContent = isRecovery
      ? "Aggiorna la password del tuo account già attivo. Ruolo, équipe e assegnazioni non vengono modificati."
      : "Imposta una password personale. Il collegamento non assegna ruoli o équipe: l’associazione è già stata autorizzata dal supervisore.";
    submit.textContent = isRecovery ? "Aggiorna password" : "Attiva account";
    form.hidden = false;
    status.textContent = isRecovery
      ? "Scegli una password di almeno 12 caratteri."
      : "Scegli una password di almeno 12 caratteri per verificare e completare l’invito.";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = password.value;
      if (newPassword.length < 12) {
        showError("La password deve contenere almeno 12 caratteri.");
        return;
      }
      if (newPassword !== confirmation.value) {
        showError("Le due password non coincidono.");
        return;
      }

      submit.disabled = true;
      status.className = "status";
      status.textContent = "Attivazione in corso…";
      let rejectedLink = false;
      try {
        if (!accessToken) {
          if (!tokenHash) throw new Error("INVITATION_TOKEN_MISSING");
          const verification = await fetch(projectUrl + "/auth/v1/verify", {
            method: "POST",
            headers: {
              "apikey": publishableKey,
              "content-type": "application/json"
            },
            body: JSON.stringify({ token_hash: tokenHash, type: flowType }),
            cache: "no-store",
            credentials: "omit"
          });
          if (!verification.ok) {
            rejectedLink = true;
            tokenHash = null;
            throw new Error("INVITATION_VERIFY_FAILED");
          }
          const session = await verification.json();
          tokenHash = null;
          if (!session || typeof session.access_token !== "string") {
            throw new Error("INVITATION_SESSION_MISSING");
          }
          accessToken = session.access_token;
        }

        const update = await fetch(projectUrl + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "apikey": publishableKey,
            "authorization": "Bearer " + accessToken,
            "content-type": "application/json"
          },
          body: JSON.stringify({ password: newPassword }),
          cache: "no-store",
          credentials: "omit"
        });
        password.value = "";
        confirmation.value = "";
        if (!update.ok) throw new Error("PASSWORD_UPDATE_FAILED");

        if (!isRecovery) {
          const acceptance = await fetch(projectUrl + "/functions/v1/team-admin", {
            method: "POST",
            headers: {
              "apikey": publishableKey,
              "authorization": "Bearer " + accessToken,
              "content-type": "application/json"
            },
            body: JSON.stringify({ action: "accept" }),
            cache: "no-store",
            credentials: "omit"
          });
          if (!acceptance.ok) throw new Error("INVITATION_ACCEPT_FAILED");
        }

        accessToken = null;
        form.hidden = true;
        status.className = "status success";
        status.textContent = isRecovery
          ? "Password aggiornata. Ora puoi aprire Event Recorder e accedere."
          : "Account attivato. Ora puoi aprire Event Recorder e accedere con email e password.";
      } catch (_) {
        if (rejectedLink) {
          password.value = "";
          confirmation.value = "";
          form.hidden = true;
          showError("Il collegamento non è valido o è scaduto. Richiedi un nuovo link dall’app oppure contatta il supervisore.");
        } else {
          showError(isRecovery
            ? "Non è stato possibile aggiornare la password. Riprova senza chiudere questa pagina oppure richiedi un nuovo link dall’app."
            : "Non è stato possibile completare l’attivazione. Riprova senza chiudere questa pagina oppure chiedi un nuovo invito.");
          submit.disabled = false;
        }
      }
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize, { once: true });
  } else {
    initialize();
  }
})();</script>
  <style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b13;color:#f5f7fa}
main{box-sizing:border-box;width:min(92vw,460px);padding:32px;border:1px solid #304052;background:#0b1521}
h1{font-size:1.6rem;margin:0 0 8px}p{color:#b9c4cf;line-height:1.45}.eyebrow{color:#ff7a59;font-size:.75rem;font-weight:750;letter-spacing:.12em}
label{display:block;margin-top:18px;font-weight:650}input{box-sizing:border-box;width:100%;margin-top:7px;padding:13px;border:1px solid #526273;background:#07101a;color:#fff;font:inherit}
button{width:100%;margin-top:22px;padding:14px;border:0;background:#ff5c35;color:#101010;font:inherit;font-weight:750;cursor:pointer}
button[disabled]{opacity:.55;cursor:wait}.status{min-height:3em;margin-top:18px}.error{color:#ff9f8a}.success{color:#7fe0a3}
[hidden]{display:none!important}</style>
  <link rel="icon" href="data:,">
  <title>Attiva Event Recorder</title>
</head>
<body>
<main>
  <p id="eyebrow" class="eyebrow">EVENT RECORDER / ACCESSO</p>
  <h1 id="title">Imposta la password</h1>
  <p id="introduction">Scegli una password personale per il tuo account Event Recorder.</p>
  <form id="activation" hidden novalidate>
    <label for="password">Nuova password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirmation">Conferma password</label>
    <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
    <button id="submit" type="submit">Salva password</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite">Verifica del collegamento…</p>
</main>
</body>
</html>
